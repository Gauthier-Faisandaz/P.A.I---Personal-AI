# geometrie.conf - position de la colonne a l'ecran, en px.
# Lu par ouvrir-colonne.sh (appele par start.sh, eww-watchdog.sh, marge.sh).
#
# Pour essayer une marge droite a chaud (et la garder) :
#     bash ~/.config/eww/marge.sh 60
# Apres une modification a la main de ce fichier :
#     bash ~/.config/eww/ouvrir-colonne.sh

# Ecart entre le bord de l'ecran et la colonne, IDENTIQUE en haut (au-dessus
# du 1er panneau) et en bas (sous le bandeau).
MARGE=20

# Ecart entre le bord DROIT de l'ecran et la colonne : laisse passer le
# panneau LXQt, place sur le bord droit (32px de large, voir
# ~/.config/lxqt/panel.conf) + 16px d'air.
MARGE_DROITE=48
